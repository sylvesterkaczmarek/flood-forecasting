name: Validate flood forecasting fixes
on:
  push:
    branches: [validation/flood-fixes-20260926]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: reproducibility
            source: 5c79ddb27acb853535867c4ed5ebaa34322a9c04
          - case: devices
            source: e43b6f82e3d2e66832a370d1ad05036bd4f7ace8
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sylvesterkaczmarek/flood-forecasting
          ref: ${{ matrix.source }}
          path: work
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r validation/requirements.txt -e work
      - name: Verify exact source, original failures, and installed wheel
        run: python validation/verify.py "${{ matrix.case }}" work evidence
      - name: Preserve logs and comparisons
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-${{ matrix.case }}
          path: evidence/
